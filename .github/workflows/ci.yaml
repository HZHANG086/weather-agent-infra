name: Weather Agent checks
"on": [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: weather-infra
          config: k8s/kind.yaml
          wait: 120s
      - run: bash scripts/demo-kind.sh --node-failure
      - run: python3 -m rag_infra.cluster --context kind-weather-infra --image weather-agent:demo --serve-weather
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weather-rag-eval-reports
          path: artifacts/rag-eval/
